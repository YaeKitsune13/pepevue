basePath: /
definitions:
  dto.AccountCreateRequest:
    properties:
      login:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      patronymic:
        description: в PHP-форме отчество необязательное
        type: string
      surname:
        type: string
    required:
    - login
    - name
    - password
    - surname
    type: object
  dto.AccountLoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  dto.AccountResponse:
    properties:
      login:
        type: string
      name:
        type: string
      patronymic:
        type: string
      role:
        type: string
      surname:
        type: string
    type: object
  dto.AccountUpdateRequest:
    properties:
      login:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      patronymic:
        type: string
      surname:
        type: string
    required:
    - login
    - name
    - surname
    type: object
  dto.CartAddRequest:
    properties:
      count:
        minimum: 1
        type: integer
      product_id:
        type: integer
    required:
    - count
    - product_id
    type: object
  dto.CartItemResponse:
    properties:
      cost:
        type: number
      count:
        type: integer
      image_url:
        type: string
      product_id:
        type: integer
      title:
        type: string
      total:
        type: number
    type: object
  dto.CartListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CartItemResponse'
        type: array
      total:
        type: number
    type: object
  dto.CartUpdateRequest:
    properties:
      count:
        minimum: 1
        type: integer
      product_id:
        type: integer
    required:
    - count
    - product_id
    type: object
  dto.OrderResponse:
    properties:
      address:
        type: string
      date_delivery:
        type: string
      id:
        type: integer
      order_status:
        $ref: '#/definitions/model.OrderStatus'
      price_all:
        type: number
      user_id:
        type: integer
    type: object
  dto.ProductResponse:
    properties:
      category_name:
        type: string
      cost:
        type: number
      count:
        type: integer
      description:
        type: string
      id:
        type: integer
      image_url:
        type: string
      title:
        type: string
    type: object
  handler.PlaceOrderInput:
    properties:
      address:
        type: string
      date_delivery:
        description: 'DateDelivery в формате ГГГГ-ММ-ДД (как <input type="date">).
          Необязательно: по умолчанию +3 дня.'
        type: string
    required:
    - address
    type: object
  model.OrderStatus:
    enum:
    - Новый
    - Отправка
    - Завершен
    - Отменен
    type: string
    x-enum-varnames:
    - OrderStatusNew
    - OrderStatusPending
    - OrderStatusCompleted
    - OrderStatusCancelled
host: localhost:8080
info:
  contact: {}
  description: 'API для интернет-магазина: продукты, корзина, заказы, аккаунты.'
  termsOfService: http://swagger.io/terms/
  title: API Service
  version: "1.0"
paths:
  /cart:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CartListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Корзина
      tags:
      - cart
    post:
      consumes:
      - application/json
      parameters:
      - description: Товар и количество
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CartAddRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CartListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Добавить в корзину
      tags:
      - cart
    put:
      consumes:
      - application/json
      parameters:
      - description: Товар и новое количество
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CartUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CartListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Изменить количество
      tags:
      - cart
  /cart/{product_id}:
    delete:
      parameters:
      - description: ID товара
        in: path
        name: product_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CartListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Удалить из корзины
      tags:
      - cart
  /login:
    post:
      consumes:
      - application/json
      description: Проверяет логин/пароль и устанавливает httpOnly cookie с JWT
      parameters:
      - description: Данные для входа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.AccountLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход в аккаунт
      tags:
      - account
  /logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Выход из аккаунта
      tags:
      - account
  /me:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Удалить аккаунт
      tags:
      - account
    get:
      description: Данные текущего пользователя (Vue использует для проверки сессии)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AccountResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Профиль
      tags:
      - account
    put:
      consumes:
      - application/json
      description: Пустой password — пароль не меняется
      parameters:
      - description: Новые данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.AccountUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Изменить профиль
      tags:
      - account
  /order:
    post:
      consumes:
      - application/json
      description: Создаёт заказ из корзины, списывает остатки со склада и очищает
        корзину
      parameters:
      - description: Адрес и дата доставки
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.PlaceOrderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.OrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Оформить заказ
      tags:
      - order
  /products:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ProductResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Список товаров
      tags:
      - product
  /products/{id}:
    get:
      parameters:
      - description: ID товара
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProductResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Карточка товара
      tags:
      - product
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные регистрации
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.AccountCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация аккаунта
      tags:
      - account
securityDefinitions:
  CookieAuth:
    in: cookie
    name: session_token
    type: apiKey
swagger: "2.0"
